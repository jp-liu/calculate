<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计算器</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --key: #3a3a3c;
    --key-fn: #505054;
    --accent: #ff9f0a;
    --text: #ffffff;
    --muted: #a1a1a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 0%, #2a2a2f, #111 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .calc {
    width: 320px;
    background: var(--panel);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .display {
    min-height: 90px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 8px 10px 14px;
    gap: 4px;
  }
  .expr {
    font-size: 15px;
    color: var(--muted);
    min-height: 18px;
    word-break: break-all;
  }
  .result {
    font-size: 44px;
    font-weight: 300;
    line-height: 1;
    word-break: break-all;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mode-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mode-bar button {
    flex: 1;
    height: 34px;
    font-size: 14px;
    border-radius: 10px;
  }
  .mode-bar .btn-normal { background: var(--accent); color: #1c1c1e; font-weight: 600; }
  .mode-bar .btn-sci { background: var(--key); }
  .calc.scientific .btn-normal { background: var(--key); color: var(--text); font-weight: 400; }
  .calc.scientific .btn-sci { background: var(--accent); color: #1c1c1e; font-weight: 600; }
  .keys.sci {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    margin-bottom: 10px;
  }
  .calc.scientific .keys.sci { display: grid; }
  .keys.sci button { height: 46px; font-size: 16px; border-radius: 12px; }
  #angleBtn { font-size: 14px; letter-spacing: .5px; }
  button {
    border: none;
    outline: none;
    cursor: pointer;
    height: 60px;
    border-radius: 16px;
    font-size: 22px;
    color: var(--text);
    background: var(--key);
    transition: filter .12s ease, transform .06s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.96); }
  button.fn { background: var(--key-fn); }
  button.accent { background: var(--accent); color: #1c1c1e; font-weight: 600; }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calc" id="calc">
    <div class="mode-bar">
      <button class="btn-normal" data-mode-btn="normal">普通</button>
      <button class="btn-sci" data-mode-btn="scientific">科学</button>
    </div>
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys sci">
      <button data-fn="sin">sin</button>
      <button data-fn="cos">cos</button>
      <button data-fn="tan">tan</button>
      <button id="angleBtn" data-fn="angle">DEG</button>
      <button data-fn="ln">ln</button>
      <button data-fn="log">log</button>
      <button data-fn="sqrt">√</button>
      <button data-fn="fact">!</button>
      <button class="accent" data-op="^">x^y</button>
      <button data-fn="pi">π</button>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">+/-</button>
      <button class="fn" data-action="percent">%</button>
      <button class="accent" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="accent" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="accent" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="accent" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="accent equals" data-action="equals">=</button>
    </div>
  </div>
  <script src="calc.js"></script>
</body>
</html>
